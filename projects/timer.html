<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Focus timer · Practice demo</title>
    <link rel="stylesheet" href="../assets/demo.css" />
  </head>
  <body>
    <main>
      <a href="../index.html#projects">← Back to portfolio</a>
      <p><small>LET’S TECH CLUB · STUDENT PRACTICE DEMO</small></p>
      <h1>Focus timer</h1>
      <p>
        Make a little space for focused work. A 25-minute session, one task at a
        time.
      </p>
      <div id="time" class="timer" role="timer" aria-label="Time remaining">
        25:00
      </div>
      <button id="start">Start</button> <button id="reset">Reset</button>
      <p id="status" role="status">Ready when you are.</p>
    </main>
    <script src="../js/timer.js"></script>
  </body>
</html>
